<style>
/* ============ THEME: DARK (nero + azzurro) ============ */
:root{
  color-scheme: dark;
  --bg:#02060d;
  --bg-2:#000000;
  --card:#071320;
  --card-2:#0a1a2e;
  --card-3:#0f2238;
  --text:#f0f9ff;
  --muted:#7fb8d9;
  --muted-2:#4d7a99;
  --line:#0f2840;
  --line-2:#1e4463;
  --accent:#38bdf8;
  --accent-2:#0ea5e9;
  --accent-3:#7dd3fc;
  --good:#34d399;
  --warn:#fbbf24;
  --bad:#f87171;
  --good-bg:rgba(16,185,129,.14);
  --warn-bg:rgba(245,158,11,.14);
  --bad-bg:rgba(239,68,68,.14);
  --muted-bg:rgba(127,184,217,.12);
  --accent-bg:rgba(56,189,248,.14);
  --input-bg:#030912;
  --input-bg-2:#061220;
  --shadow-sm:0 1px 2px rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.65), 0 16px 40px -20px rgba(0,0,0,.9), 0 0 40px -20px rgba(56,189,248,.18);
  --shadow-lg:0 2px 4px rgba(0,0,0,.7), 0 28px 60px -24px rgba(0,0,0,1), 0 0 60px -20px rgba(56,189,248,.3);
  --page-glow-1:rgba(56,189,248,.16);
  --page-glow-2:rgba(14,165,233,.13);
  --header-gradient:linear-gradient(135deg,#010812 0%,#031b33 45%,#062e4d 100%);
  --header-glow-1:rgba(56,189,248,.32);
  --header-glow-2:rgba(14,165,233,.26);
  --header-text:#ffffff;
  --header-tagline:#c9e6f7;
  --header-grid:rgba(255,255,255,.025);
  --tb-bg:rgba(255,255,255,.07);
  --tb-border:rgba(255,255,255,.14);
  --tb-text:#ffffff;
  --tb-hover-bg:rgba(255,255,255,.14);
  --tb-hover-border:rgba(255,255,255,.28);
  --main-grad-from:rgba(56,189,248,.18);
  --main-grad-to:rgba(14,165,233,.10);
  --main-border:rgba(56,189,248,.35);
  --main-value-from:#7dd3fc;
  --main-value-to:#38bdf8;
  --btn-grad-from:#3b82f6;
  --btn-grad-to:#06b6d4;
  --glow-accent-soft:rgba(56,189,248,.35);
  --glow-accent-med:rgba(56,189,248,.5);
  --glow-accent-strong:rgba(56,189,248,.7);
  --glow-accent-max:rgba(56,189,248,.9);
  --selection-bg:rgba(56,189,248,.4);
  --modal-backdrop:rgba(2,6,13,.75);
}

/* ============ THEME: LIGHT (bianco-azzurro + blu) ============ */
html[data-theme="light"]{
  color-scheme: light;
  --bg:#f0f9ff;
  --bg-2:#ffffff;
  --card:#ffffff;
  --card-2:#f0f9ff;
  --card-3:#e0f2fe;
  --text:#041a2e;
  --muted:#3a6f94;
  --muted-2:#6a9cbb;
  --line:#d4eaf7;
  --line-2:#b0d9ef;
  --accent:#0284c7;
  --accent-2:#0369a1;
  --accent-3:#0ea5e9;
  --muted-bg:rgba(106,156,187,.10);
  --accent-bg:rgba(2,132,199,.10);
  --input-bg:#ffffff;
  --input-bg-2:#f8fcff;
  --shadow-sm:0 1px 2px rgba(0,40,80,.06);
  --shadow:0 1px 2px rgba(0,40,80,.06), 0 14px 34px -18px rgba(0,40,80,.20);
  --shadow-lg:0 2px 4px rgba(0,40,80,.08), 0 24px 50px -24px rgba(0,40,80,.28);
  --page-glow-1:rgba(56,189,248,.10);
  --page-glow-2:rgba(14,165,233,.08);
  --header-gradient:linear-gradient(135deg,#ffffff 0%,#f0faff 45%,#e0f5ff 100%);
  --header-glow-1:rgba(56,189,248,.18);
  --header-glow-2:rgba(14,165,233,.14);
  --header-text:#041a2e;
  --header-tagline:#3a6f94;
  --header-grid:rgba(2,132,199,.04);
  --tb-bg:rgba(2,132,199,.07);
  --tb-border:rgba(2,132,199,.18);
  --tb-text:#041a2e;
  --tb-hover-bg:rgba(2,132,199,.14);
  --tb-hover-border:rgba(2,132,199,.32);
  --main-grad-from:rgba(56,189,248,.14);
  --main-grad-to:rgba(14,165,233,.08);
  --main-border:rgba(2,132,199,.28);
  --main-value-from:#0ea5e9;
  --main-value-to:#0369a1;
  --btn-grad-from:#0ea5e9;
  --btn-grad-to:#3b82f6;
  --glow-accent-soft:rgba(2,132,199,.35);
  --glow-accent-med:rgba(2,132,199,.5);
  --glow-accent-strong:rgba(2,132,199,.7);
  --glow-accent-max:rgba(2,132,199,.9);
  --selection-bg:rgba(56,189,248,.4);
  --modal-backdrop:rgba(0,40,80,.45);
}

*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-tap-highlight-color:transparent}
body{
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
  font-feature-settings:"cv11","ss01","ss03";
  background:
    radial-gradient(1100px 600px at 82% -8%, var(--page-glow-1), transparent 60%),
    radial-gradient(900px 500px at -8% 108%, var(--page-glow-2), transparent 60%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  -webkit-text-size-adjust:100%;
  letter-spacing:-.005em;
  transition:background .35s ease, color .35s ease;
}
::selection{background:var(--selection-bg);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:10px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}

.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* ---------- header ---------- */
header{
  position:relative;
  background:
    radial-gradient(700px 260px at 12% 10%, var(--header-glow-1), transparent 70%),
    radial-gradient(700px 260px at 88% 90%, var(--header-glow-2), transparent 70%),
    var(--header-gradient);
  border-bottom:1px solid var(--line);
  color:var(--header-text);
  padding:calc(28px + env(safe-area-inset-top)) 0 80px;
  overflow:hidden;
  transition:background .35s ease, color .35s ease, border-color .35s ease;
}
header::before{
  content:"";position:absolute;inset:0;
  background-image:
    linear-gradient(var(--header-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--header-grid) 1px, transparent 1px);
  background-size:36px 36px;
  mask-image:radial-gradient(ellipse at center, #000 25%, transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse at center, #000 25%, transparent 78%);
  pointer-events:none;
}
header::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,var(--glow-accent-med),transparent);
}
.head-row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;z-index:1}
h1{font-size:23px;margin:0;font-weight:800;letter-spacing:-.03em;text-shadow:0 2px 20px var(--glow-accent-soft)}
.tagline{font-size:13.5px;color:var(--header-tagline);margin-top:6px;letter-spacing:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tb{
  background:var(--tb-bg); border:1px solid var(--tb-border); color:var(--tb-text);
  padding:9px 15px; border-radius:11px; font-size:13px; font-weight:600; cursor:pointer;
  transition:background .18s, border-color .18s, transform .12s, box-shadow .18s, color .18s;
  font-family:inherit; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  letter-spacing:-.005em;
}
.tb:hover{background:var(--tb-hover-bg);border-color:var(--tb-hover-border);transform:translateY(-1px)}
.tb:active{transform:translateY(0)}
.tb.danger:hover{background:rgba(239,68,68,.9); border-color:transparent; color:#fff;box-shadow:0 8px 24px -8px rgba(239,68,68,.6)}
.tb.theme{font-size:15px;padding:9px 12px;line-height:1}

/* ---------- main ---------- */
main{margin-top:-60px; padding-bottom:calc(70px + env(safe-area-inset-bottom))}

.card{
  position:relative;
  background:linear-gradient(180deg, var(--card) 0%, var(--card-2) 100%);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:var(--shadow);
  transition:background .35s ease, border-color .35s ease, box-shadow .35s ease;
}
.card::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(140deg, rgba(56,189,248,.10), transparent 35%, transparent 65%, rgba(14,165,233,.10));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  pointer-events:none;
}

.summary{display:grid;grid-template-columns:1.15fr 1fr;gap:24px;padding:24px}
@media(max-width:840px){.summary{grid-template-columns:1fr}}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{
  background:linear-gradient(180deg,var(--card-3),var(--card-2));
  border:1px solid var(--line);border-radius:14px;padding:13px 15px;
  transition:border-color .2s, transform .2s, background .35s ease;
}
.stat:hover{border-color:var(--line-2)}
.stat .k{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:700}
.stat .v{font-size:19px;font-weight:800;margin-top:4px;letter-spacing:-.025em;color:var(--text)}
.stat.main{
  grid-column:1 / -1;
  background:
    radial-gradient(500px 120px at 100% 0%, var(--main-grad-to), transparent 70%),
    linear-gradient(135deg, var(--main-grad-from), var(--main-grad-to));
  border-color:var(--main-border);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 8px 32px -16px var(--glow-accent-med);
}
.stat.main .v{
  font-size:44px;line-height:1.02;
  background:linear-gradient(135deg, var(--main-value-from), var(--main-value-to));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 16px var(--glow-accent-soft));
}
.stat.main .v.good{background:linear-gradient(135deg,#34d399,#6ee7b7);filter:drop-shadow(0 2px 16px rgba(52,211,153,.35))}
.stat.main .v.warn{background:linear-gradient(135deg,#fbbf24,#fcd34d);filter:drop-shadow(0 2px 16px rgba(251,191,36,.35))}
.stat.main .v.bad{background:linear-gradient(135deg,#f87171,#fca5a5);filter:drop-shadow(0 2px 16px rgba(248,113,113,.35))}
.stat.main .v.muted{background:linear-gradient(135deg,#94a3b8,#cbd5e1);filter:none}
.stat.main .v.good,.stat.main .v.warn,.stat.main .v.bad,.stat.main .v.muted{-webkit-background-clip:text;background-clip:text}
.stat.main .exact{font-size:12px;color:var(--muted);font-weight:600;margin-top:4px;letter-spacing:.02em}

.chart-side{display:flex;flex-direction:column;min-width:0}
.chart-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:8px}
.trend{width:100%;height:auto;display:block}
.chart-empty{
  flex:1;display:flex;align-items:center;justify-content:center;text-align:center;
  color:var(--muted);font-size:13px;border:1px dashed var(--line-2);border-radius:14px;min-height:160px;padding:16px;
  background:radial-gradient(400px 200px at 50% 50%, var(--accent-bg), transparent 70%);
}

.settings{
  grid-column:1/-1;display:flex;gap:20px;align-items:center;flex-wrap:wrap;
  border-top:1px solid var(--line);padding-top:16px;font-size:13.5px;color:var(--muted);
}
.settings label{display:flex;align-items:center;gap:8px;cursor:pointer;transition:color .15s}
.settings label:hover{color:var(--text)}
.settings input[type=number]{
  width:60px;padding:6px 9px;border:1px solid var(--line-2);border-radius:10px;
  font-weight:700;color:var(--text);font-size:13.5px;text-align:center;font-family:inherit;
  background:var(--input-bg);outline:none;transition:border-color .15s, box-shadow .15s, background .35s;
}
.settings input[type=number]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.22)}
.settings input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;cursor:pointer}
.legend{font-size:11.5px;color:var(--muted-2);letter-spacing:.02em;margin-left:auto}
.legend b{color:var(--muted);font-weight:800}

/* ---------- subjects ---------- */
.section-head{display:flex;align-items:center;justify-content:space-between;margin:30px 0 16px;gap:12px;flex-wrap:wrap}
.section-head h2{font-size:16px;margin:0;font-weight:800;letter-spacing:-.015em;color:var(--text)}
.add-subject{display:flex;gap:8px;width:100%}
@media(min-width:640px){.add-subject{width:auto}}
.add-subject input{
  padding:10px 15px;border:1px solid var(--line-2);border-radius:12px;font-size:14px;
  font-family:inherit;color:var(--text);background:var(--input-bg);min-width:0;flex:1;outline:none;
  transition:border-color .15s, box-shadow .15s, background .35s;
}
@media(min-width:640px){.add-subject input{min-width:230px;flex:0 1 auto}}
.add-subject input::placeholder{color:var(--muted-2)}
.add-subject input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.22);background:var(--input-bg-2)}

#subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
@media(max-width:400px){#subjects{grid-template-columns:1fr}}

.subject{
  position:relative;
  background:linear-gradient(180deg, var(--card) 0%, var(--card-2) 100%);
  border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:13px;
  transition:border-color .2s, transform .2s, box-shadow .25s, background .35s ease;
  animation:fadeUp .35s ease-out both;
}
.subject::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(140deg, rgba(56,189,248,.08), transparent 40%, transparent 60%, rgba(14,165,233,.08));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor; mask-composite:exclude;
  pointer-events:none;
}
.subject:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.subject-head{display:flex;align-items:center;gap:10px}
.subject-name{font-weight:800;font-size:15.5px;flex:1;letter-spacing:-.015em;word-break:break-word;color:var(--text)}
.avg-badge{
  font-size:16px;font-weight:800;padding:5px 13px;border-radius:999px;font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;
}
.avg-badge.good{background:var(--good-bg);color:var(--good);box-shadow:inset 0 0 0 1px rgba(52,211,153,.2)}
.avg-badge.warn{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1px rgba(251,191,36,.2)}
.avg-badge.bad{background:var(--bad-bg);color:var(--bad);box-shadow:inset 0 0 0 1px rgba(248,113,113,.2)}
.avg-badge.muted{background:var(--muted-bg);color:var(--muted)}
.icon-btn{
  background:transparent;border:none;color:var(--muted-2);cursor:pointer;font-size:16px;
  padding:5px 7px;border-radius:9px;line-height:1;transition:background .15s, color .15s;
}
.icon-btn:hover{background:rgba(239,68,68,.15);color:var(--bad)}

.spark{height:46px}
.spark svg{width:100%;height:100%;display:block}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:none;border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;font-family:inherit;
  font-variant-numeric:tabular-nums;transition:transform .15s, filter .15s, box-shadow .15s;
  letter-spacing:-.01em;
}
.chip:hover{transform:scale(1.07);filter:brightness(1.15)}
.chip:active{transform:scale(.97)}
.chip.good{background:var(--good-bg);color:var(--good);box-shadow:inset 0 0 0 1px rgba(52,211,153,.18)}
.chip.warn{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1px rgba(251,191,36,.18)}
.chip.bad{background:var(--bad-bg);color:var(--bad);box-shadow:inset 0 0 0 1px rgba(248,113,113,.18)}
.chip.muted{background:var(--muted-bg);color:var(--muted)}
.chip .w{font-size:10.5px;opacity:.8;font-weight:700}
.chip.add{
  background:transparent;color:var(--accent);border:1.5px dashed rgba(56,189,248,.45);font-weight:700;
}
html[data-theme="light"] .chip.add{border-color:rgba(2,132,199,.45)}
.chip.add:hover{background:var(--accent-bg);color:var(--accent-3);border-color:var(--accent);border-style:solid}

.planner{
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);
  border-top:1px dashed var(--line-2);padding-top:13px;margin-top:auto;
}
.planner input{
  width:52px;padding:5px 7px;border:1px solid var(--line-2);border-radius:9px;text-align:center;
  font-weight:800;color:var(--text);font-size:13px;font-family:inherit;outline:none;
  background:var(--input-bg);transition:border-color .15s, background .35s;
}
.planner input:focus{border-color:var(--accent)}
.planner-out{font-weight:800;font-size:15.5px;margin-left:auto;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.planner-out.good{color:var(--good)}
.planner-out.warn{color:var(--warn)}
.planner-out.bad{color:var(--bad)}
.planner-out.muted{color:var(--muted)}

.empty-state{
  grid-column:1/-1;text-align:center;padding:56px 24px;border:2px dashed var(--line-2);
  border-radius:18px;color:var(--muted);
  background:radial-gradient(600px 300px at 50% 0%, var(--accent-bg), transparent 70%);
}
.empty-icon{font-size:40px;margin-bottom:12px;filter:drop-shadow(0 6px 24px var(--glow-accent-med))}
.empty-state h3{margin:0 0 8px;color:var(--text);font-size:17px;letter-spacing:-.02em}
.empty-state p{margin:0;font-size:13.5px}

footer{text-align:center;font-size:12px;color:var(--muted-2);padding:0 20px calc(44px + env(safe-area-inset-bottom));letter-spacing:.005em}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:var(--modal-backdrop);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .35s ease}
.modal.hidden{display:none}
.modal-card{
  background:linear-gradient(180deg,var(--card-2) 0%,var(--card) 100%);
  border:1px solid var(--line-2);border-radius:22px;padding:26px;width:100%;max-width:440px;
  box-shadow:0 32px 90px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.02);
  animation:pop .2s cubic-bezier(.2,.9,.3,1.2);
  max-height:90vh;overflow:auto;
  transition:background .35s ease, border-color .35s ease;
}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal-card h3{margin:0 0 20px;font-size:17px;font-weight:800;letter-spacing:-.02em;color:var(--text)}
.field{margin-bottom:15px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px}
.field input{
  width:100%;padding:11px 13px;border:1px solid var(--line-2);border-radius:12px;
  font-size:15px;font-family:inherit;color:var(--text);outline:none;background:var(--input-bg);
  transition:border-color .15s, box-shadow .15s, background .35s;
}
.field input::placeholder{color:var(--muted-2)}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.22);background:var(--input-bg-2)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.quick button{
  flex:1 0 auto;min-width:40px;padding:9px 0;border-radius:10px;border:1px solid var(--line-2);
  background:var(--input-bg);font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;color:var(--text);
  transition:background .15s, border-color .15s, color .15s, transform .12s;
}
.quick button:hover{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.quick button.sel{background:linear-gradient(135deg,var(--btn-grad-from),var(--btn-grad-to));color:#fff;border-color:transparent;box-shadow:0 6px 18px -8px var(--glow-accent-max)}
.modal-actions{display:flex;gap:10px;margin-top:22px}
.btn{flex:1;padding:12px;border-radius:12px;border:none;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;transition:filter .15s, transform .12s, background .15s;letter-spacing:-.005em}
.btn.primary{background:linear-gradient(135deg,var(--btn-grad-from),var(--btn-grad-to));color:#fff;box-shadow:0 8px 22px -10px var(--glow-accent-strong)}
.btn.primary:hover{filter:brightness(1.14);transform:translateY(-1px)}
.btn.primary:active{transform:translateY(0)}
.btn.ghost{background:var(--card-3);color:var(--muted)}
.btn.ghost:hover{background:var(--card-2);color:var(--text)}

/* ---------- MOBILE ---------- */
@media (max-width:640px){
  .wrap{padding:0 16px}
  h1{font-size:20px}
  .summary{padding:18px;gap:18px}
  .stat.main .v{font-size:40px}

  .tb{padding:11px 16px;font-size:13.5px}
  .tb.theme{padding:11px 13px}
  .chip{padding:8px 15px;font-size:14.5px}
  .quick button{padding:13px 0;font-size:15px;min-width:44px}
  .btn{padding:15px;font-size:15px}
  .icon-btn{padding:9px 11px;font-size:18px}

  .add-subject input,
  .field input,
  .planner input,
  .settings input[type=number]{ font-size:16px; }
  .planner input{ width:58px; }

  .modal{padding:0; align-items:flex-end}
  .modal-card{
    border-radius:24px 24px 0 0;
    max-width:100%;
    padding-bottom:calc(26px + env(safe-area-inset-bottom));
    animation:slideUp .24s cubic-bezier(.2,.9,.3,1.1);
  }
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

  .chip:hover{transform:none;filter:none}
  .tb:hover{background:var(--tb-bg);transform:none}
  .subject:hover{transform:none;box-shadow:var(--shadow)}
}
</style>
</head>
<body>

<header>
  <div class="wrap head-row">
    <div>
      <h1>📊 I miei voti</h1>
      <div class="tagline">Medie, andamento e voto necessario per la sufficienza · <span id="syncStat">…</span></div>
    </div>
    <div class="toolbar">
      <button class="tb theme" id="btnTheme" type="button" title="Cambia tema chiaro/scuro" aria-label="Cambia tema">🌙</button>
      <button class="tb" id="btnExport">↓ Esporta</button>
      <button class="tb" id="btnSync" type="button">☁ Sync</button>
      <button class="tb" id="btnImport" type="button">↑ Importa</button>
      <input type="file" id="fileImport" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none" tabindex="-1">
      <button class="tb danger" id="btnReset">Reset</button>
    </div>
  </div>
</header>

<main class="wrap">

  <section class="card summary" id="summary"></section>

  <div class="section-head">
    <h2>Materie</h2>
    <div class="add-subject">
      <input type="text" id="newSubject" placeholder="Nome materia (es. Matematica)" autocomplete="off">
      <button class="btn primary" id="btnAddSubject" style="flex:0 0 auto;padding:10px 20px">+ Aggiungi</button>
    </div>
  </div>

  <section id="subjects"></section>
</main>

<footer>I dati sono salvati nel browser e, se attivi ☁ Sync, anche online, con un codice da incollare sugli altri dispositivi. Nessun collegamento a ClasseViva.</footer>

<!-- MODAL -->
<div class="modal hidden" id="modal">
  <div class="modal-card">
    <h3 id="modalTitle">Aggiungi voto</h3>

    <div class="field">
      <label>Voto</label>
      <div class="quick" id="quickRow"></div>
      <input type="number" id="gValue" step="0.25" min="1" max="10" placeholder="es. 7,5" inputmode="decimal">
    </div>

    <div class="field">
      <label>Tipo / nota (facoltativo)</label>
      <input type="text" id="gNote" placeholder="es. Verifica di algebra" autocomplete="off">
    </div>

    <div class="field">
      <label>Data</label>
      <input type="date" id="gDate">
    </div>

    <div class="field">
      <label>Peso (1 = normale)</label>
      <input type="number" id="gWeight" value="1" min="0.5" step="0.5" inputmode="decimal">
    </div>

    <div class="modal-actions">
      <button class="btn ghost" id="mCancel">Annulla</button>
      <button class="btn primary" id="mSave">Salva voto</button>
    </div>
  </div>
</div>

<script>
/* ================= UTILS ================= */
const KEY = 'voti-scuola-v2';
const THEME_KEY = 'voti-theme';
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d = 2) => (n === null || n === undefined || Number.isNaN(n)) ? '—' : n.toFixed(d).replace('.', ',');
const fmtG = n => (n === null || n === undefined) ? '—' : (Number.isInteger(n) ? String(n) : String(parseFloat(n.toFixed(2))).replace('.', ','));
const todayStr = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; };

/* formato voti all'italiana: 5.75→6-, 6.25→6+, 6.5→6½ */
function gradeDisplay(v) {
  if (v === null || v === undefined || Number.isNaN(v)) return '—';
  const x = Math.max(1, Math.min(10, v));
  const rounded = Math.round(x * 4) / 4;
  const whole = Math.floor(rounded);
  const fracQ = Math.round((rounded - whole) * 4);
  if (fracQ === 0) return String(whole);
  if (fracQ === 1) return whole + '+';
  if (fracQ === 2) return whole + '½';
  if (fracQ === 3) return (whole + 1) + '-';
  return String(rounded);
}

/* ================= THEME ================= */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', t === 'light' ? '#f0f9ff' : '#02060d');
  const btn = $('#btnTheme');
  if (btn) {
    btn.textContent = t === 'light' ? '☀️' : '🌙';
    btn.title = t === 'light' ? 'Passa alla modalità scura' : 'Passa alla modalità chiara';
    btn.setAttribute('aria-label', btn.title);
  }
}
function initTheme() {
  let t = null;
  try { t = localStorage.getItem(THEME_KEY); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = 'dark';
  applyTheme(t);
}
$('#btnTheme').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme || 'dark';
  const next = cur === 'light' ? 'dark' : 'light';
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
});

/* ================= STATE ================= */
const emptyState = () => ({ subjects: [], sufficiency: 6, weighted: false, planner: {}, updatedAt: 0 });
const cleanState = (s, ts) => ({
  subjects: Array.isArray(s.subjects) ? s.subjects : [],
  sufficiency: typeof s.sufficiency === 'number' ? s.sufficiency : 6,
  weighted: !!s.weighted,
  planner: s.planner || {},
  updatedAt: ts
});
function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return emptyState();
    const s = JSON.parse(raw);
    return cleanState(s, Number(s.updatedAt) || 0);
  } catch (e) {
    return emptyState();
  }
}
let state = loadState();

/* ================= SYNC (codice condiviso tra dispositivi, via jsonblob.com) ================= */
const CFG = 'voti-sync-code';
const API = 'https://jsonblob.com/api/jsonBlob';
const HDR = { 'Content-Type': 'application/json', Accept: 'application/json' };
let syncCfg = null;
try { syncCfg = JSON.parse(localStorage.getItem(CFG) || 'null'); } catch (e) {}
let applyingRemote = false, pushTimer = null, pollTimer = null, busy = false, writing = false, dirty = false;
const setSync = t => { const el = $('#syncStat'); if (el) el.textContent = t; };
const saveCfg = () => { try { localStorage.setItem(CFG, JSON.stringify(syncCfg)); } catch (e) {} };
const payload = () => JSON.stringify({ json: JSON.stringify(state), updatedAt: state.updatedAt || 0 });
const errTxt = e => (e && e.name === 'TypeError') ? 'rete assente o richiesta bloccata' : String((e && e.message) || e);

async function createBlob() {
  const r = await fetch(API, { method: 'POST', headers: HDR, body: payload() });
  if (!r.ok) throw new Error('errore ' + r.status);
  const loc = r.headers.get('Location') || r.headers.get('X-jsonblob');
  if (!loc) throw new Error('il servizio non ha restituito il codice');
  return loc.split('/').pop();
}

const saveState = () => {
  if (!applyingRemote) state.updatedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  if (!applyingRemote) pushCloud();
};

function pushCloud() {
  if (!syncCfg) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(flush, 800);
}
async function flush() {
  if (!syncCfg) return;
  if (writing) { dirty = true; return; }
  writing = true;
  try {
    const r = await fetch(API + '/' + syncCfg.id, { method: 'PUT', headers: HDR, body: payload() });
    if (r.status === 404) throw new Error('codice non valido o scaduto');
    if (!r.ok) throw new Error('errore ' + r.status);
    setSync('☁️ sincronizzato');
  } catch (e) {
    setSync('⚠️ invio non riuscito: ' + errTxt(e));
  } finally {
    writing = false;
    if (dirty) { dirty = false; flush(); }
  }
}

async function pullCloud() {
  if (!syncCfg || busy) return;
  busy = true;
  try {
    const r = await fetch(API + '/' + syncCfg.id, { headers: HDR, cache: 'no-store' });
    if (r.status === 404) throw new Error('codice non valido o scaduto');
    if (!r.ok) throw new Error('errore ' + r.status);
    const d = await r.json();
    const mine = state.updatedAt || 0;
    const remoteTs = Number(d && d.updatedAt) || 0;
    if (d && typeof d.json === 'string' && remoteTs > mine) {
      const x = JSON.parse(d.json);
      applyingRemote = true;
      try { state = cleanState(x, remoteTs); render(); }
      finally { applyingRemote = false; }
    } else if (remoteTs < mine) {
      flush();
    }
    setSync('☁️ sincronizzato');
  } catch (e) {
    setSync('⚠️ lettura non riuscita: ' + errTxt(e));
  } finally { busy = false; }
}

function initCloud() {
  clearInterval(pollTimer);
  if (!syncCfg) return setSync('sync non attiva');
  setSync('…');
  pullCloud();
  pollTimer = setInterval(pullCloud, 20000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) pullCloud(); });

$('#btnSync').addEventListener('click', async () => {
  if (syncCfg) {
    const v = prompt('Codice di sincronizzazione (copialo e incollalo sugli altri dispositivi).\nScrivi "scollega" per disattivare la sync.', syncCfg.id);
    if (v === null) return;
    const t = v.trim();
    if (t.toLowerCase() === 'scollega') {
      syncCfg = null;
      try { localStorage.removeItem(CFG); } catch (e) {}
      return initCloud();
    }
    if (t && t !== syncCfg.id) { syncCfg = { id: t }; saveCfg(); }
    return initCloud();
  }
  const v = prompt('Hai già un codice da un altro dispositivo? Incollalo qui.\nSe è il primo dispositivo, lascia vuoto e premi OK: ne creo uno nuovo.');
  if (v === null) return;
  let id = v.trim();
  try {
    setSync('…');
    if (!id) {
      id = await createBlob();
      prompt('Ecco il tuo codice: copialo e incollalo sugli altri dispositivi (☁ Sync).', id);
    }
    syncCfg = { id };
    saveCfg();
    initCloud();
  } catch (e) { setSync('⚠️ impossibile creare il codice: ' + errTxt(e)); }
});

/* ================= CALC ================= */
function avgOf(grades) {
  if (!grades || !grades.length) return null;
  if (state.weighted) {
    let ws = 0, s = 0;
    grades.forEach(g => { const w = g.weight || 1; ws += w; s += g.value * w; });
    return ws ? s / ws : null;
  }
  return grades.reduce((a, g) => a + g.value, 0) / grades.length;
}
const allGrades = () =>
  state.subjects
    .flatMap(s => s.grades.map(g => ({ ...g, subjectId: s.id, subjectName: s.name })))
    .sort((a, b) => a.ts - b.ts);

function cumulativeMeans(grades) {
  const out = []; let s = 0, w = 0;
  grades.forEach(g => {
    const ww = state.weighted ? (g.weight || 1) : 1;
    s += g.value * ww; w += ww;
    out.push(s / w);
  });
  return out;
}
const colorClass = v => v === null ? 'muted' : (v >= state.sufficiency ? 'good' : (v >= state.sufficiency - 0.5 ? 'warn' : 'bad'));

function plannerResult(sub, missing) {
  const target = state.sufficiency;
  if (missing <= 0) return { txt: '—', cls: 'muted', exact: null };
  const grades = sub.grades;
  if (!grades.length) return { txt: gradeDisplay(target), cls: 'good', exact: target };
  const n = grades.length;
  const simple = grades.reduce((a, g) => a + g.value, 0) / n;
  const need = (target * (n + missing) - simple * n) / missing;
  if (need > 10) return { txt: 'impossibile', cls: 'bad', exact: need };
  if (need <= 1) return { txt: '≤ 1', cls: 'good', exact: need };
  const cls = need <= target ? 'good' : (need <= 8 ? 'warn' : 'bad');
  return { txt: gradeDisplay(need), cls, exact: need };
}

/* ================= SVG (theme-aware via CSS vars) ================= */
function sparkline(grades) {
  if (grades.length < 2) return '';
  const W = 240, H = 56, P = 6;
  const vals = grades.map(g => g.value);
  const suff = state.sufficiency;
  let lo = Math.min(...vals, suff) - 0.6;
  let hi = Math.max(...vals, suff) + 0.6;
  lo = Math.max(1, lo); hi = Math.min(10, hi);
  if (hi - lo < 1) hi = lo + 1;
  const X = i => P + i * (W - 2 * P) / (vals.length - 1);
  const Y = v => H - P - ((v - lo) / (hi - lo)) * (H - 2 * P);
  const pts = vals.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const sy = Y(suff).toFixed(1);
  const last = vals[vals.length - 1];
  const lastColor = last >= suff ? 'var(--good)' : 'var(--bad)';
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" style="stop-color:var(--accent);stop-opacity:1"/>
      <stop offset="100%" style="stop-color:var(--accent-3);stop-opacity:1"/>
    </linearGradient></defs>
    <line x1="${P}" y1="${sy}" x2="${W-P}" y2="${sy}" style="stroke:var(--line-2)" stroke-dasharray="4 4" stroke-width="1.2"/>
    <polyline points="${pts}" style="fill:none;stroke:url(#sg);stroke-width:2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(vals.length-1).toFixed(1)}" cy="${Y(last).toFixed(1)}" r="3.6" style="fill:${lastColor};stroke:var(--card)" stroke-width="1.8"/>
  </svg>`;
}

function trendSVG() {
  const grades = allGrades();
  if (grades.length < 2) {
    return `<div class="chart-empty">Aggiungi almeno 2 voti<br>per vedere l'andamento</div>`;
  }
  const W = 560, H = 170, P = 20;
  const means = cumulativeMeans(grades);
  const suff = state.sufficiency;
  let lo = Math.min(...means, suff) - 0.5;
  let hi = Math.max(...means, suff) + 0.5;
  lo = Math.max(1, lo); hi = Math.min(10, hi);
  if (hi - lo < 1.2) hi = lo + 1.2;
  const X = i => P + i * (W - 2 * P) / (means.length - 1);
  const Y = v => H - P - ((v - lo) / (hi - lo)) * (H - 2 * P);
  const pts = means.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const sy = Y(suff).toFixed(1);
  const last = means[means.length - 1];
  const lastColor = last >= suff ? 'var(--good)' : 'var(--bad)';
  return `<svg viewBox="0 0 ${W} ${H}" class="trend" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" style="stop-color:var(--accent);stop-opacity:.42"/>
        <stop offset="100%" style="stop-color:var(--accent);stop-opacity:0"/>
      </linearGradient>
      <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" style="stop-color:var(--accent);stop-opacity:1"/>
        <stop offset="100%" style="stop-color:var(--accent-3);stop-opacity:1"/>
      </linearGradient>
    </defs>
    <line x1="${P}" y1="${sy}" x2="${W-P}" y2="${sy}" style="stroke:var(--line-2)" stroke-dasharray="5 5" stroke-width="1.4"/>
    <polygon points="${P},${H-P} ${pts} ${X(means.length-1).toFixed(1)},${H-P}" style="fill:url(#ag)"/>
    <polyline points="${pts}" style="fill:none;stroke:url(#lg);stroke-width:2.8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(means.length-1).toFixed(1)}" cy="${Y(last).toFixed(1)}" r="5" style="fill:${lastColor};stroke:var(--card)" stroke-width="2.2"/>
  </svg>`;
}

/* ================= RENDER ================= */
function renderSummary() {
  const grades = allGrades();
  const overall = avgOf(grades);
  const withGrades = state.subjects.filter(s => s.grades.length);

  let best = null, worst = null;
  withGrades.forEach(s => {
    const a = avgOf(s.grades);
    if (!best || a > best.a) best = { name: s.name, a };
    if (!worst || a < worst.a) worst = { name: s.name, a };
  });

  $('#summary').innerHTML = `
    <div class="stats">
      <div class="stat main">
        <div class="k">Media generale${state.weighted ? ' (ponderata)' : ''}</div>
        <div class="v ${colorClass(overall)}">${overall === null ? '—' : gradeDisplay(overall)}</div>
        ${overall !== null && !Number.isInteger(overall) ? `<div class="exact">esatto: ${fmtG(overall)}</div>` : ''}
      </div>
      <div class="stat"><div class="k">Voti totali</div><div class="v">${grades.length}</div></div>
      <div class="stat"><div class="k">Materie</div><div class="v">${state.subjects.length}</div></div>
      <div class="stat">
        <div class="k">Migliore</div>
        <div class="v" style="font-size:14px" ${best ? `title="Media esatta: ${fmtG(best.a)}"` : ''}>${best ? esc(best.name) + ' · ' + gradeDisplay(best.a) : '—'}</div>
      </div>
      <div class="stat">
        <div class="k">Da recuperare</div>
        <div class="v" style="font-size:14px" ${worst ? `title="Media esatta: ${fmtG(worst.a)}"` : ''}>${worst ? esc(worst.name) + ' · ' + gradeDisplay(worst.a) : '—'}</div>
      </div>
    </div>
    <div class="chart-side">
      <div class="chart-title">Andamento media generale</div>
      ${trendSVG()}
    </div>
    <div class="settings">
      <label>Sufficienza:
        <input type="number" id="suffInput" min="1" max="10" step="0.5" value="${state.sufficiency}" inputmode="decimal">
      </label>
      <label>
        <input type="checkbox" id="weightedChk" ${state.weighted ? 'checked' : ''}>
        Usa media ponderata (per peso)
      </label>
      <span class="legend">5,75→<b>6-</b> · 6,25→<b>6+</b> · 6,5→<b>6½</b></span>
    </div>
  `;
}

function subjectCard(sub) {
  const grades = [...sub.grades].sort((a, b) => a.ts - b.ts);
  const avg = avgOf(grades);
  const cls = colorClass(avg);
  const missing = state.planner[sub.id] ?? 2;
  const res = plannerResult(sub, missing);

  const chips = grades.map(g => `
    <button class="chip ${colorClass(g.value)}"
            data-action="del-grade" data-subject="${sub.id}" data-grade="${g.id}"
            title="${esc(gradeDisplay(g.value) + ' (' + fmtG(g.value) + ')' + (g.note ? ' · ' + g.note : ''))} — clicca per eliminare">
      ${gradeDisplay(g.value)}${(g.weight && g.weight !== 1) ? `<span class="w">×${fmtG(g.weight)}</span>` : ''}
    </button>`).join('');

  return `
  <div class="subject">
    <div class="subject-head">
      <div class="subject-name">${esc(sub.name)}</div>
      <div class="avg-badge ${cls}" ${avg !== null ? `title="Media esatta: ${fmtG(avg)}"` : ''}>${avg === null ? '—' : gradeDisplay(avg)}</div>
      <button class="icon-btn" data-action="del-subject" data-subject="${sub.id}" title="Elimina materia">✕</button>
    </div>

    <div class="spark">${sparkline(grades)}</div>

    <div class="chips">
      ${chips}
      <button class="chip add" data-action="add-grade" data-subject="${sub.id}">+ voto</button>
    </div>

    <div class="planner" title="Calcolo basato sulla media semplice dei voti attuali">
      <span>Sufficienza con</span>
      <input type="number" min="0" max="20" value="${missing}" data-planner="${sub.id}" inputmode="numeric">
      <span>voti mancanti →</span>
      <span class="planner-out ${res.cls}" data-out="${sub.id}"${res.exact !== null ? ` title="Voto esatto: ${fmtG(res.exact)}"` : ''}>${res.txt}</span>
    </div>
  </div>`;
}

function renderSubjects() {
  const el = $('#subjects');
  if (!state.subjects.length) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📚</div>
        <h3>Nessuna materia ancora</h3>
        <p>Aggiungi la tua prima materia qui sopra e inizia a inserire i voti.</p>
      </div>`;
    return;
  }
  el.innerHTML = state.subjects.map(subjectCard).join('');
}

function updatePlannerOut(subId) {
  const sub = state.subjects.find(s => s.id === subId);
  const out = document.querySelector('[data-out="' + subId + '"]');
  if (!sub || !out) return;
  const missing = state.planner[subId] ?? 0;
  const res = plannerResult(sub, missing);
  out.textContent = res.txt;
  out.className = 'planner-out ' + res.cls;
  if (res.exact !== null) out.title = 'Voto esatto: ' + fmtG(res.exact);
  else out.removeAttribute('title');
}

function render() {
  renderSummary();
  renderSubjects();
  saveState();
}

/* ================= ACTIONS ================= */
function addSubject(name) {
  name = name.trim();
  if (!name) return;
  state.subjects.push({ id: uid(), name, grades: [] });
  render();
}

function deleteSubject(id) {
  const sub = state.subjects.find(s => s.id === id);
  if (!sub) return;
  if (!confirm(`Eliminare la materia "${sub.name}" e tutti i suoi voti?`)) return;
  state.subjects = state.subjects.filter(s => s.id !== id);
  delete state.planner[id];
  render();
}

function deleteGrade(subjectId, gradeId) {
  const sub = state.subjects.find(s => s.id === subjectId);
  if (!sub) return;
  const g = sub.grades.find(x => x.id === gradeId);
  if (!g) return;
  if (!confirm(`Eliminare il voto ${gradeDisplay(g.value)} (${fmtG(g.value)}) in ${sub.name}?`)) return;
  sub.grades = sub.grades.filter(x => x.id !== gradeId);
  render();
}

/* ================= MODAL ================= */
let modalCtx = { subjectId: null };

function openModal(subjectId) {
  const sub = state.subjects.find(s => s.id === subjectId);
  if (!sub) return;
  modalCtx.subjectId = subjectId;
  $('#modalTitle').textContent = 'Aggiungi voto · ' + sub.name;
  $('#gValue').value = '';
  $('#gNote').value = '';
  $('#gWeight').value = 1;
  $('#gDate').value = todayStr();
  document.querySelectorAll('#quickRow button').forEach(b => b.classList.remove('sel'));
  $('#modal').classList.remove('hidden');
  setTimeout(() => $('#gValue').focus(), 50);
}

function closeModal() {
  $('#modal').classList.add('hidden');
  modalCtx.subjectId = null;
}

function saveGrade() {
  const sub = state.subjects.find(s => s.id === modalCtx.subjectId);
  if (!sub) return;
  const raw = $('#gValue').value.replace(',', '.');
  const value = parseFloat(raw);
  if (Number.isNaN(value) || value < 1 || value > 10) {
    alert('Inserisci un voto valido tra 1 e 10.');
    $('#gValue').focus();
    return;
  }
  let weight = parseFloat($('#gWeight').value);
  if (Number.isNaN(weight) || weight <= 0) weight = 1;

  const dateStr = $('#gDate').value || todayStr();
  const d = new Date(dateStr + 'T12:00:00');
  const ts = Number.isNaN(d.getTime()) ? Date.now() : d.getTime();

  sub.grades.push({
    id: uid(),
    value,
    weight,
    note: $('#gNote').value.trim(),
    date: dateStr,
    ts
  });

  closeModal();
  render();
}

/* ================= EVENTS ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (el) {
    const a = el.dataset.action;
    if (a === 'del-subject') return deleteSubject(el.dataset.subject);
    if (a === 'add-grade') return openModal(el.dataset.subject);
    if (a === 'del-grade') return deleteGrade(el.dataset.subject, el.dataset.grade);
  }
  if (e.target.classList.contains('modal')) closeModal();
});

document.addEventListener('input', e => {
  if (e.target.matches('[data-planner]')) {
    const id = e.target.dataset.planner;
    const v = Math.max(0, Math.min(20, parseInt(e.target.value, 10) || 0));
    state.planner[id] = v;
    saveState();
    updatePlannerOut(id);
  }
  if (e.target.id === 'gValue') {
    const v = parseFloat(e.target.value.replace(',', '.'));
    document.querySelectorAll('#quickRow button').forEach(b => {
      b.classList.toggle('sel', parseFloat(b.dataset.v) === v);
    });
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'suffInput') {
    let v = parseFloat(e.target.value);
    if (Number.isNaN(v) || v < 1) v = 6;
    if (v > 10) v = 10;
    state.sufficiency = v;
    render();
  }
  if (e.target.id === 'weightedChk') {
    state.weighted = e.target.checked;
    render();
  }
});

$('#btnAddSubject').addEventListener('click', () => {
  const inp = $('#newSubject');
  addSubject(inp.value);
  inp.value = '';
  inp.focus();
});
$('#newSubject').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    addSubject(e.target.value);
    e.target.value = '';
  }
});

$('#mCancel').addEventListener('click', closeModal);
$('#mSave').addEventListener('click', saveGrade);
$('#gValue').addEventListener('keydown', e => { if (e.key === 'Enter') saveGrade(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* quick buttons */
(function buildQuick() {
  const vals = [5, 5.25, 5.5, 5.75, 6, 6.25, 6.5, 6.75, 7, 8, 9, 10];
  $('#quickRow').innerHTML = vals.map(v =>
    `<button type="button" data-v="${v}" title="Inserisci ${fmtG(v)}">${gradeDisplay(v)}</button>`).join('');
  $('#quickRow').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    $('#gValue').value = b.dataset.v;
    document.querySelectorAll('#quickRow button').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel');
  });
})();

/* export / import / reset */
$('#btnExport').addEventListener('click', async () => {
  const filename = 'voti-scuola-' + todayStr() + '.json';
  const text = JSON.stringify(state, null, 2);
  try {
    const dl = typeof claude !== 'undefined' && claude.use ? await claude.use('downloads') : null;
    if (dl) { await dl.save({ filename, data: text }); return; }
  } catch (e) { return; }
  const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
});
$('#btnImport').addEventListener('click', () => $('#fileImport').click());

$('#fileImport').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data.subjects)) throw new Error('formato non valido');
      state = {
        subjects: data.subjects.map(s => ({
          id: s.id || uid(),
          name: String(s.name || 'Materia'),
          grades: (s.grades || []).map(g => ({
            id: g.id || uid(),
            value: Number(g.value) || 0,
            weight: Number(g.weight) || 1,
            note: String(g.note || ''),
            date: g.date || todayStr(),
            ts: Number(g.ts) || Date.now()
          }))
        })),
        sufficiency: typeof data.sufficiency === 'number' ? data.sufficiency : 6,
        weighted: !!data.weighted,
        planner: data.planner || {},
        updatedAt: 0
      };
      render();
      alert('Importazione completata.');
    } catch (err) {
      alert('File non valido: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

$('#btnReset').addEventListener('click', () => {
  if (!confirm('Cancellare TUTTI i dati (materie e voti)? L\'operazione è irreversibile.')) return;
  state = emptyState();
  render();
});

/* ================= START ================= */
initTheme();
applyingRemote = true; render(); applyingRemote = false;
initCloud();
</script>
</body>
</html>
